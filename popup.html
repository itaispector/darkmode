<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Universal Dark Mode</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #111;
      color: #e8e8e8;
      user-select: none;
    }

    /* ---- Header ---- */
    header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px 12px;
      border-bottom: 1px solid #2a2a2a;
    }
    header .logo {
      font-size: 20px;
    }
    header h1 {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    /* ---- Rows ---- */
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid #1e1e1e;
    }
    .row:last-child { border-bottom: none; }

    .row-label {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .row-label span {
      font-size: 13px;
      font-weight: 500;
    }
    .row-label small {
      font-size: 11px;
      color: #888;
    }

    /* ---- Toggle switch ---- */
    .toggle {
      position: relative;
      width: 44px;
      height: 24px;
      flex-shrink: 0;
    }
    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
      position: absolute;
    }
    .slider {
      position: absolute;
      inset: 0;
      background: #3a3a3a;
      border-radius: 24px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .slider::before {
      content: '';
      position: absolute;
      width: 18px;
      height: 18px;
      left: 3px;
      top: 3px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s;
    }
    .toggle input:checked + .slider {
      background: #4a90d9;
    }
    .toggle input:checked + .slider::before {
      transform: translateX(20px);
    }
    .toggle input:focus-visible + .slider {
      outline: 2px solid #4a90d9;
      outline-offset: 2px;
    }

    /* ---- Site badge ---- */
    #site-name {
      font-size: 11px;
      color: #aaa;
      max-width: 170px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ---- Footer ---- */
    footer {
      padding: 10px 16px;
      font-size: 11px;
      color: #555;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <span class="logo">🌙</span>
    <h1>Universal Dark Mode</h1>
  </header>

  <!-- Global toggle -->
  <div class="row">
    <div class="row-label">
      <span>Enable globally</span>
      <small>Apply dark mode to all websites</small>
    </div>
    <label class="toggle" aria-label="Toggle global dark mode">
      <input type="checkbox" id="global-toggle" />
      <span class="slider"></span>
    </label>
  </div>

  <!-- Per-site toggle -->
  <div class="row">
    <div class="row-label">
      <span>This site</span>
      <small id="site-name">loading…</small>
    </div>
    <label class="toggle" aria-label="Toggle dark mode for this site">
      <input type="checkbox" id="site-toggle" />
      <span class="slider"></span>
    </label>
  </div>

  <footer>No system theme required &mdash; works everywhere</footer>

  <script src="popup.js"></script>
</body>
</html>
